server:
  port: 8085

spring:
  application:
    name: admin-server

  boot:
    admin:
      discovery:
        # Discover client applications through Eureka
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

logging:
  level:
    de.codecentric.boot.admin: INFO